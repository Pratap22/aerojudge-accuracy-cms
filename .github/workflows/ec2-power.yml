name: EC2 power

# Start/stop the instance to control cost. Requires AWS credentials with ec2:StartInstances / StopInstances.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Instance action'
        required: true
        type: choice
        options:
          - start
          - stop
          - status

permissions:
  contents: read
  id-token: write

jobs:
  power:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run EC2 action
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID}" ]; then
            echo "Set repository secret EC2_INSTANCE_ID"
            exit 1
          fi
          case "${ACTION}" in
            start)
              aws ec2 start-instances --instance-ids "${INSTANCE_ID}"
              aws ec2 wait instance-running --instance-ids "${INSTANCE_ID}"
              ;;
            stop)
              aws ec2 stop-instances --instance-ids "${INSTANCE_ID}"
              aws ec2 wait instance-stopped --instance-ids "${INSTANCE_ID}"
              ;;
            status)
              aws ec2 describe-instances --instance-ids "${INSTANCE_ID}" \
                --query 'Reservations[0].Instances[0].{State:State.Name,PublicIp:PublicIpAddress,Type:InstanceType}' \
                --output table
              ;;
          esac
          aws ec2 describe-instances --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].{State:State.Name,PublicIp:PublicIpAddress}' \
            --output table
