name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag override (default: git SHA)'
        required: false
        type: string
      deploy:
        description: 'Deploy to EC2 after build'
        required: true
        type: boolean
        default: true
      force_all:
        description: 'Build all services (ignore change detection)'
        required: false
        type: boolean
        default: false
      base_sha:
        description: 'Diff base SHA (default: push before SHA, else last successful deploy, else HEAD~1)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      retag_apps: ${{ steps.plan.outputs.retag_apps }}
      has_build: ${{ steps.plan.outputs.has_build }}
      has_retag: ${{ steps.plan.outputs.has_retag }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
      summary: ${{ steps.plan.outputs.summary }}
      should_deploy: ${{ steps.plan.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plan builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all || false }}
          BASE_SHA_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || '' }}
          IMAGE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          SHOULD_DEPLOY: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG_INPUT:-${GITHUB_SHA}}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=${SHOULD_DEPLOY}" >> "$GITHUB_OUTPUT"

          ALL_APPS='["api","admin","judge","display","public-results","marketing"]'

          matrix_for() {
            # stdin: newline-separated app names → JSON matrix include
            node -e '
              const apps = require("fs").readFileSync(0, "utf8").trim().split("\n").filter(Boolean);
              const buildArgs = {
                api: "",
                admin: "APP_NAME=admin\nBASE_PATH=/admin/",
                judge: "APP_NAME=judge\nBASE_PATH=/judge/",
                display: "APP_NAME=display\nBASE_PATH=/display/",
                "public-results": "APP_NAME=public-results\nBASE_PATH=/events/",
                marketing: "APP_NAME=marketing\nBASE_PATH=/\nVITE_SITE_URL=https://aerojudge.nepalabs.com\nVITE_CONTACT_EMAIL=hello@nepalabs.com",
              };
              const dockerfile = (app) => (app === "api" ? "docker/Dockerfile.api" : "docker/Dockerfile.web");
              const include = apps.map((app) => ({
                app,
                dockerfile: dockerfile(app),
                build_args: buildArgs[app] ?? "",
              }));
              process.stdout.write(JSON.stringify(include));
            '
          }

          if [ "${FORCE_ALL}" = "true" ]; then
            BUILD="$(printf '%s\n' api admin judge display public-results marketing | matrix_for)"
            echo "build_matrix=${BUILD}" >> "$GITHUB_OUTPUT"
            echo "retag_apps=[]" >> "$GITHUB_OUTPUT"
            echo "has_build=true" >> "$GITHUB_OUTPUT"
            echo "has_retag=false" >> "$GITHUB_OUTPUT"
            echo "summary=force_all: building every service" >> "$GITHUB_OUTPUT"
            echo "::notice::Force build all services"
            exit 0
          fi

          ZERO_SHA='0000000000000000000000000000000000000000'
          BASE="${BASE_SHA_INPUT:-}"

          # Prefer the pre-push SHA on merges to main (exact change set for this push).
          if [ -z "${BASE}" ] && [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "${ZERO_SHA}" ]; then
            if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              BASE="${PUSH_BEFORE}"
            fi
          fi

          if [ -z "${BASE}" ]; then
            BASE="$(gh run list \
              --workflow "Build and deploy" \
              --branch "${GITHUB_REF_NAME}" \
              --status success \
              --limit 20 \
              --json headSha,databaseId \
              --jq "[.[] | select(.headSha != \"${GITHUB_SHA}\")][0].headSha // empty" \
              || true)"
          fi
          if [ -z "${BASE}" ] || [ "${BASE}" = "${GITHUB_SHA}" ]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE="$(git rev-parse HEAD^)"
            else
              BASE=""
            fi
          fi

          if [ -z "${BASE}" ]; then
            echo "::warning::No base SHA available; building all services"
            BUILD="$(printf '%s\n' api admin judge display public-results marketing | matrix_for)"
            echo "build_matrix=${BUILD}" >> "$GITHUB_OUTPUT"
            echo "retag_apps=[]" >> "$GITHUB_OUTPUT"
            echo "has_build=true" >> "$GITHUB_OUTPUT"
            echo "has_retag=false" >> "$GITHUB_OUTPUT"
            echo "summary=no base SHA; building every service" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing ${BASE}...${GITHUB_SHA}"
          CHANGED="$(git diff --name-only "${BASE}" "${GITHUB_SHA}" || true)"
          echo "Changed files:"
          echo "${CHANGED}"

          # Global rebuild triggers
          if echo "${CHANGED}" | grep -Eq '^(package-lock\.json|package\.json|turbo\.json|docker/Dockerfile\.web)$'; then
            echo "::notice::Root/lockfile or Dockerfile.web changed — building all web apps + api if needed"
            BUILD_API=1
            BUILD_ADMIN=1
            BUILD_JUDGE=1
            BUILD_DISPLAY=1
            BUILD_PUBLIC=1
            BUILD_MARKETING=1
          else
            BUILD_API=0
            BUILD_ADMIN=0
            BUILD_JUDGE=0
            BUILD_DISPLAY=0
            BUILD_PUBLIC=0
            BUILD_MARKETING=0
          fi

          echo "${CHANGED}" | grep -Eq '^(server/|database/|packages/scoring-engine/|packages/pdf-engine/|docker/Dockerfile\.api|docker/api-entrypoint\.sh)' && BUILD_API=1 || true
          echo "${CHANGED}" | grep -Eq '^packages/(shared|utils)/' && BUILD_API=1 || true

          echo "${CHANGED}" | grep -Eq '^packages/(shared|utils|ui)/' && {
            BUILD_ADMIN=1; BUILD_JUDGE=1; BUILD_DISPLAY=1; BUILD_PUBLIC=1; BUILD_MARKETING=1;
          } || true

          echo "${CHANGED}" | grep -Eq '^apps/admin/' && BUILD_ADMIN=1 || true
          echo "${CHANGED}" | grep -Eq '^apps/judge/' && BUILD_JUDGE=1 || true
          echo "${CHANGED}" | grep -Eq '^apps/display/' && BUILD_DISPLAY=1 || true
          echo "${CHANGED}" | grep -Eq '^apps/public-results/' && BUILD_PUBLIC=1 || true
          echo "${CHANGED}" | grep -Eq '^apps/marketing/' && BUILD_MARKETING=1 || true

          # Workflow/deploy-only changes: no image rebuild required
          BUILD_LIST=""
          [ "${BUILD_API}" = "1" ] && BUILD_LIST="${BUILD_LIST}api"$'\n'
          [ "${BUILD_ADMIN}" = "1" ] && BUILD_LIST="${BUILD_LIST}admin"$'\n'
          [ "${BUILD_JUDGE}" = "1" ] && BUILD_LIST="${BUILD_LIST}judge"$'\n'
          [ "${BUILD_DISPLAY}" = "1" ] && BUILD_LIST="${BUILD_LIST}display"$'\n'
          [ "${BUILD_PUBLIC}" = "1" ] && BUILD_LIST="${BUILD_LIST}public-results"$'\n'
          [ "${BUILD_MARKETING}" = "1" ] && BUILD_LIST="${BUILD_LIST}marketing"$'\n'

          BUILD_LIST="$(printf '%s' "${BUILD_LIST}" | sed '/^$/d')"

          if [ -z "${BUILD_LIST}" ]; then
            echo "::notice::No service source changes — retagging all apps from :latest"
            echo "build_matrix=[]" >> "$GITHUB_OUTPUT"
            echo "retag_apps=${ALL_APPS}" >> "$GITHUB_OUTPUT"
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            echo "has_retag=true" >> "$GITHUB_OUTPUT"
            echo "summary=no app source changes; retag all from latest → ${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RETAG_LIST=""
          for app in api admin judge display public-results marketing; do
            if ! printf '%s\n' "${BUILD_LIST}" | grep -qx "${app}"; then
              RETAG_LIST="${RETAG_LIST}${app}"$'\n'
            fi
          done
          RETAG_LIST="$(printf '%s' "${RETAG_LIST}" | sed '/^$/d')"

          BUILD="$(printf '%s\n' "${BUILD_LIST}" | matrix_for)"
          if [ -n "${RETAG_LIST}" ]; then
            RETAG="$(printf '%s\n' "${RETAG_LIST}" | node -e 'const a=require("fs").readFileSync(0,"utf8").trim().split("\n").filter(Boolean); process.stdout.write(JSON.stringify(a))')"
            HAS_RETAG=true
          else
            RETAG='[]'
            HAS_RETAG=false
          fi

          echo "build_matrix=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "retag_apps=${RETAG}" >> "$GITHUB_OUTPUT"
          echo "has_build=true" >> "$GITHUB_OUTPUT"
          echo "has_retag=${HAS_RETAG}" >> "$GITHUB_OUTPUT"
          echo "summary=build: $(echo "${BUILD_LIST}" | tr '\n' ' '); retag: $(echo "${RETAG_LIST}" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "::notice::Build [$(echo "${BUILD_LIST}" | tr '\n' ' ')] Retag [$(echo "${RETAG_LIST}" | tr '\n' ' ')]"

  build:
    name: Build & push (${{ matrix.app }})
    needs: detect
    if: needs.detect.outputs.has_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Buildx boots by pulling moby/buildkit from Docker Hub; Hub timeouts are common on GHA.
      # Mirror + retry avoids "Client.Timeout exceeded while awaiting headers".
      - name: Configure Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info 2>/dev/null | grep -A3 'Registry Mirrors' || true

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Retry Docker Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.detect.outputs.image_tag }}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  retag:
    name: Retag unchanged (${{ matrix.app }})
    needs: detect
    if: needs.detect.outputs.has_retag == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.retag_apps) }}
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point new tag at existing :latest
        env:
          APP: ${{ matrix.app }}
          TAG: ${{ needs.detect.outputs.image_tag }}
        run: |
          set -euo pipefail
          SRC="${REGISTRY}/${IMAGE_NAME}/${APP}:latest"
          DEST="${REGISTRY}/${IMAGE_NAME}/${APP}:${TAG}"
          echo "Retag ${SRC} → ${DEST}"
          if ! docker buildx imagetools inspect "${SRC}" >/dev/null 2>&1; then
            echo "::error::Missing ${SRC}. Run once with force_all=true to seed :latest images."
            exit 1
          fi
          docker buildx imagetools create --tag "${DEST}" "${SRC}"
          # Keep short SHA alias when TAG is full SHA
          SHORT="$(echo "${TAG}" | cut -c1-7)"
          if [ "${SHORT}" != "${TAG}" ]; then
            docker buildx imagetools create --tag "${REGISTRY}/${IMAGE_NAME}/${APP}:${SHORT}" "${SRC}" || true
          fi

  deploy:
    name: Deploy to EC2
    needs: [detect, build, retag]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.detect.outputs.should_deploy == 'true' &&
      needs.detect.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.retag.result == 'success' || needs.retag.result == 'skipped')
    environment: production
    steps:
      - name: Checkout (deploy assets)
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ needs.detect.outputs.image_tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Plan: ${{ needs.detect.outputs.summary }}"

      - name: Sync compose + nginx + deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker/docker-compose.deploy.yml,docker/nginx/*,scripts/ec2-deploy.sh"
          target: ${{ secrets.EC2_DEPLOY_PATH }}
          overwrite: true

      - name: Pull and restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_REGISTRY: ${{ steps.tag.outputs.registry }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG,IMAGE_REGISTRY,GHCR_TOKEN,GHCR_USER,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            chmod +x scripts/ec2-deploy.sh
            if [ ! -f docker/.env.deploy ]; then
              echo "ERROR: ${DEPLOY_PATH}/docker/.env.deploy missing."
              echo "On the server: cp docker/.env.deploy.example docker/.env.deploy && edit secrets."
              exit 1
            fi
            if grep -q '^IMAGE_REGISTRY=' docker/.env.deploy; then
              sed -i "s|^IMAGE_REGISTRY=.*|IMAGE_REGISTRY=${IMAGE_REGISTRY}|" docker/.env.deploy
            else
              echo "IMAGE_REGISTRY=${IMAGE_REGISTRY}" >> docker/.env.deploy
            fi
            export IMAGE_TAG GHCR_TOKEN GHCR_USER
            ./scripts/ec2-deploy.sh
