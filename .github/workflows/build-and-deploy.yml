name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag override (default: git SHA)'
        required: false
        type: string
      deploy:
        description: 'Deploy to EC2 after build'
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: docker/Dockerfile.api
            build_args: ''
          - app: admin
            dockerfile: docker/Dockerfile.web
            build_args: |
              APP_NAME=admin
              BASE_PATH=/admin/
          - app: judge
            dockerfile: docker/Dockerfile.web
            build_args: |
              APP_NAME=judge
              BASE_PATH=/judge/
          - app: display
            dockerfile: docker/Dockerfile.web
            build_args: |
              APP_NAME=display
              BASE_PATH=/display/
          - app: public-results
            dockerfile: docker/Dockerfile.web
            build_args: |
              APP_NAME=public-results
              BASE_PATH=/results/
          - app: marketing
            dockerfile: docker/Dockerfile.web
            build_args: |
              APP_NAME=marketing
              BASE_PATH=/
              VITE_SITE_URL=https://aerojudge.nepalabs.com
              VITE_CONTACT_EMAIL=hello@nepalabs.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}
          tags: |
            type=raw,value=${{ inputs.image_tag || github.sha }}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: inputs.deploy == true
    environment: production
    steps:
      - name: Checkout (deploy assets)
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Sync compose + nginx + deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker/docker-compose.deploy.yml,docker/nginx/*,scripts/ec2-deploy.sh"
          target: ${{ secrets.EC2_DEPLOY_PATH }}
          overwrite: true

      - name: Pull and restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_REGISTRY: ${{ steps.tag.outputs.registry }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG,IMAGE_REGISTRY,GHCR_TOKEN,GHCR_USER,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            chmod +x scripts/ec2-deploy.sh
            if [ ! -f docker/.env.deploy ]; then
              echo "ERROR: ${DEPLOY_PATH}/docker/.env.deploy missing."
              echo "On the server: cp docker/.env.deploy.example docker/.env.deploy && edit secrets."
              exit 1
            fi
            if grep -q '^IMAGE_REGISTRY=' docker/.env.deploy; then
              sed -i "s|^IMAGE_REGISTRY=.*|IMAGE_REGISTRY=${IMAGE_REGISTRY}|" docker/.env.deploy
            else
              echo "IMAGE_REGISTRY=${IMAGE_REGISTRY}" >> docker/.env.deploy
            fi
            export IMAGE_TAG GHCR_TOKEN GHCR_USER
            ./scripts/ec2-deploy.sh
