# Production deploy – pull pre-built images (no local build)
# Usage on EC2:
#   docker compose -f docker/docker-compose.deploy.yml --env-file docker/.env.deploy pull
#   docker compose -f docker/docker-compose.deploy.yml --env-file docker/.env.deploy up -d
#
# IMAGE_REGISTRY / IMAGE_TAG come from docker/.env.deploy (set by CI or manually).

services:
  postgres:
    image: postgres:15-alpine
    container_name: aerojudge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aerojudge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env.deploy}
      POSTGRES_DB: ${POSTGRES_DB:-aerojudge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Only reachable on the Docker network — not published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aerojudge} -d ${POSTGRES_DB:-aerojudge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aerojudge

  api:
    image: ${IMAGE_REGISTRY}/api:${IMAGE_TAG:-latest}
    container_name: aerojudge-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-aerojudge}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aerojudge}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      UPLOAD_DIR: /app/uploads
      PRINT_ARCHIVE_DIR: /app/uploads/documents/prints
      PUBLIC_RESULTS_URL: ${PUBLIC_RESULTS_URL:?Set PUBLIC_RESULTS_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
      API_URL: ${API_URL:?Set API_URL}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-15000}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - aerojudge

  admin:
    image: ${IMAGE_REGISTRY}/admin:${IMAGE_TAG:-latest}
    container_name: aerojudge-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aerojudge

  judge:
    image: ${IMAGE_REGISTRY}/judge:${IMAGE_TAG:-latest}
    container_name: aerojudge-judge
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aerojudge

  display:
    image: ${IMAGE_REGISTRY}/display:${IMAGE_TAG:-latest}
    container_name: aerojudge-display
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aerojudge

  public-results:
    image: ${IMAGE_REGISTRY}/public-results:${IMAGE_TAG:-latest}
    container_name: aerojudge-public-results
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aerojudge

  nginx:
    image: nginx:1.27-alpine
    container_name: aerojudge-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - admin
      - judge
      - display
      - public-results
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/admin/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aerojudge

volumes:
  postgres_data:
  uploads_data:

networks:
  aerojudge:
    driver: bridge
