# Docker embedded DNS — re-resolve service IPs when containers are recreated.
# Static `upstream { server name:port; }` caches IPs at nginx start and causes
# path-app 404s after deploys that recreate app containers but not nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade map for Socket.IO
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Social / search crawlers need server-rendered meta (SPA HTML is empty for them).
map $http_user_agent $is_link_preview_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|Slackbot|Slack-ImgProxy|TelegramBot|Discordbot|SkypeUriPreview|Googlebot|bingbot|Baiduspider|YandexBot|DuckDuckBot|Applebot|redditbot|Embedly|Quora\ Link\ Preview|outbrain|pinterest|vkShare|W3C_Validator|bitlybot|nuzzel|Qwantify|Xing-preview|Slackbot-LinkExpanding|Iframely|OpenGraph|developer\.developers\.facebook\.com) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API
    location /api/ {
        set $upstream_api api:4000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Socket.IO (real-time scoring, displays)
    location /socket.io/ {
        set $upstream_api api:4000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploaded media (served by API static middleware or proxied)
    location /uploads/ {
        set $upstream_api api:4000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO artifacts at site root
    location = /sitemap.xml {
        set $upstream_api api:4000;
        proxy_pass http://$upstream_api/api/v1/public/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        set $upstream_api api:4000;
        proxy_pass http://$upstream_api/api/v1/public/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend apps (path-prefixed SPAs)
    # Exact prefix without slash → keep users inside the app (avoid marketing SPA)
    location = /admin { return 301 /admin/; }
    location = /judge { return 301 /judge/; }
    location = /display { return 301 /display/; }
    location = /results { return 301 /results/; }

    # Legacy client-side escapes from public-results (missing router basename)
    # e.g. /competition/:id/results → /results/competition/:id/results
    location /competition/ {
        return 301 /results$request_uri;
    }

    location /admin/ {
        set $upstream_admin admin:80;
        proxy_pass http://$upstream_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /judge/ {
        set $upstream_judge judge:80;
        proxy_pass http://$upstream_judge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /display/ {
        set $upstream_display display:80;
        proxy_pass http://$upstream_display;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public results: bots get OG/meta HTML from API; browsers get the SPA.
    location /results/ {
        error_page 418 = @results_seo_html;
        if ($is_link_preview_bot) {
            return 418;
        }
        set $upstream_results public-results:80;
        proxy_pass http://$upstream_results;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @results_seo_html {
        set $upstream_api api:4000;
        proxy_pass http://$upstream_api/api/v1/public/seo/render;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Marketing site at /
    location / {
        set $upstream_marketing marketing:80;
        proxy_pass http://$upstream_marketing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

