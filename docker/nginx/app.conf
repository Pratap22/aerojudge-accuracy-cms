server {
    listen 80;
    server_name _;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Hashed files can be cached. index.html must revalidate so a normal
    # navigation loads the current app instead of a bundle from the last visit.
    location ${BASE_PATH}assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA assets and routes under BASE_PATH (e.g. /admin/)
    location ${BASE_PATH} {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ @spa_fallback;
        add_header Cache-Control "no-cache";
    }

    location @spa_fallback {
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache";
    }

    location = / {
        return 302 ${BASE_PATH};
    }
}
